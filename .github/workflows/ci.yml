name: CI Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      # Cheap checks first so a format slip fails in seconds.
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Markdown lint
        run: npx -y markdownlint-cli2@0.23 "**/*.md" "#**/node_modules/**" "#**/target/**"
      - name: Clippy
        run: cargo clippy --all-targets --workspace --exclude sim-tauri 2>&1 | (! grep -E "^error" | grep -v "Rust 2015")
      - name: Build
        run: cargo build --release --workspace --exclude sim-tauri
      - name: Unit tests
        run: cargo test --workspace --exclude sim-tauri
      - name: Scenario regression
        run: ./scripts/run-ci.sh
